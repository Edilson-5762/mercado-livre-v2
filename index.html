<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
    <title>Mercado Livre</title>
</head>

<body>
    <a href="https://porfifolio-theta.vercel.app/"
        style="position:fixed;top:14px;right:14px;z-index:9999;background:rgba(0,0,0,0.6);color:#fff;text-decoration:none;font-size:13px;padding:8px 14px;border-radius:20px;display:inline-flex;align-items:center;gap:6px;font-family:Arial,sans-serif;">←
        Voltar ao Portfólio</a>

    <header class="header">
        <div class="container">

            <div class="search-container">
                <img alt="logo-mercado-livre" class="logo"
                    src="https://http2.mlstatic.com/D_NQ_NP_758782-MLA78816706095_082024-F.jpg">

                <input type="text" id="searchInput" placeholder="Buscar produtos... " class="search-input">

                <button id="searchBtn" class="search-btn">
                    <i class="fa-solid fa-magnifying-glass"></i>

                </button>


            </div>

        </div>
    </header>




    <main class="main">
        <div class="container">
            <h2 class="section-title">Ofertas do dia</h2>
            <div class="products-grid" id="productsGrid">


                <!-- os nossos produtos - serão inseridos pelo javascripts-->
            </div>

        </div>
    </main>


    <footer class="footer">
        <p>Clone do Mercado Livre - Oficial DevClub</p>
    </footer>


    <script src="scripts.js"></script>
</body>

</html>
